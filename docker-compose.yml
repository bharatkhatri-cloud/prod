version: '3.8'

services:
  dharaksha-portal:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dharaksha-portal
    restart: unless-stopped
    ports:
      # Map host port 3002 to internal container port 3000
      - "3002:3000"
    env_file:
      - .env
    environment:
      - PORT=3000
      - NODE_ENV=production
      - FRONTEND_URL=http://localhost:3002/
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/v2s/settings || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
